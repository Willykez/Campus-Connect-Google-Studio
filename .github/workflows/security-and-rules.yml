name: Security Rules & Schema Validation

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'firestore.rules'
      - 'firebase-blueprint.json'
      - 'supabase/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'firestore.rules'
      - 'firebase-blueprint.json'
      - 'supabase/**'
  workflow_dispatch:

jobs:
  validate-rules-and-schema:
    name: Validate Firestore Rules & Database Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Firestore Blueprint JSON Schema
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('firebase-blueprint.json')) {
              const data = JSON.parse(fs.readFileSync('firebase-blueprint.json', 'utf8'));
              console.log('Valid JSON blueprint loaded:', Object.keys(data));
            } else {
              console.log('No firebase-blueprint.json found, skipping.');
            }
          "

      - name: Verify Firestore Rules Syntax
        run: |
          if [ -f firestore.rules ]; then
            echo "Checking firestore.rules presence and basic syntax..."
            grep -q "service cloud.firestore" firestore.rules || (echo "Missing cloud.firestore service header" && exit 1)
            echo "firestore.rules syntax header verified."
          fi
