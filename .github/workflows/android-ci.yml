name: Android CI & Automated Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release_bundle:
        description: 'Build Android App Bundle (.aab) in addition to APK'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test CampusConnect
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle Wrapper Jar
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle Cache & Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Ensure Executable Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment Configuration
        run: |
          echo "=== Setting up Build Environment ==="
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          fi

          # Restore debug.keystore from base64 if not present in workspace
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Generate a valid debug keystore if none exists
          if [ ! -f debug.keystore ]; then
            echo "Generating a default debug keystore for CI..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f debug.keystore ]; then
            echo "✓ debug.keystore verified ($(wc -c < debug.keystore) bytes)"
          else
            echo "⚠ Notice: debug.keystore still missing"
            exit 1
          fi

      - name: Run Unit & JVM Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --continue --no-daemon

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusconnect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Android App Bundle (Optional / On Demand)
        if: ${{ inputs.build_release_bundle == true || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Building Android App Bundle..."
          ./gradlew :app:bundleDebug --stacktrace --no-daemon

      - name: Upload App Bundle Artifact
        if: ${{ inputs.build_release_bundle == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: campusconnect-debug-bundle
          path: app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Generate Build Summary
        if: always()
        run: |
          echo "### 📱 CampusConnect GitHub Actions Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status | File Path | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
            echo "| Debug APK | ✅ Built | `app-debug.apk` | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ❌ Failed | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f app/build/outputs/bundle/debug/app-debug.aab ]; then
            AAB_SIZE=$(du -h app/build/outputs/bundle/debug/app-debug.aab | awk '{print $1}')
            echo "| Debug AAB | ✅ Built | `app-debug.aab` | $AAB_SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built successfully with Gradle Wrapper & JDK 21." >> $GITHUB_STEP_SUMMARY
